<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docent</title>
    <script>
        // Apply the saved appearance before first paint (no light→dark flash).
        (function () {
            var t = localStorage.getItem('frame.theme');
            if (t !== 'light' && t !== 'dark') {
                t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }
            document.documentElement.dataset.theme = t;
            var b = localStorage.getItem('frame.bezel');
            if (b) document.documentElement.dataset.bezel = b;
            // The desktop app opens /?window=vibrant in a translucent native
            // window; let the desktop show through (see html.vibrant in style.css).
            if (/[?&]window=vibrant\b/.test(location.search)) {
                document.documentElement.classList.add('vibrant');
            }
        })();
    </script>
    <link rel="stylesheet" href="/static/style.css">
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
    {% include "partials/icons.html" %}
    {% block content %}{% endblock %}
    <script src="/static/app.js"></script>
</body>
</html>
